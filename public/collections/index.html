<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f2f3f5">
  <title>Коллекции · НекромантЛиб</title>

  <link rel="stylesheet" href="/site.css?v=20260819-reader1">
  <link rel="stylesheet" href="/nekromantlib.css?v=20260912-home1">
  <link rel="stylesheet" href="/collections.css?v=20260912-collections2">
  <script defer src="/vendor/lucide.min.js?v=1.27.0"></script>
  <script defer src="/ui-icons.js?v=20260820-icons3"></script>
  <script defer src="/collections.js?v=20260912-collections2"></script>
</head>
<body class="nl-body collections-body">
  <header class="site-header nl-header">
    <div class="nl-shell nl-header-inner">
      <button class="mobile-menu-button nl-icon-button" id="mobileMenuButton" type="button" aria-label="Открыть меню"><i data-lucide="menu"></i></button>
      <a class="nl-brand" href="/" aria-label="НекромантЛиб — главная"><img src="/brand/team-logo.webp" alt="" width="40" height="40"><span>НекромантЛиб</span></a>
      <nav class="primary-nav nl-nav" id="primaryNav" aria-label="Основная навигация">
        <a href="/catalog/">Каталог</a>
        <a class="active" href="/collections/">Коллекции</a>
        <a href="https://t.me/domnekromanta" target="_blank" rel="noreferrer">Форум</a>
      </nav>
      <div class="header-actions nl-header-actions">
        <a class="nl-header-action" href="/propose/"><i data-lucide="circle-plus"></i><span>Добавить</span></a>
        <a id="adminLink" class="admin-entry hidden" href="/admin/"><i data-lucide="shield-cog"></i><span>Admin</span></a>
        <details class="account-menu nl-account"><summary><i data-lucide="user-round"></i><span id="accountName">Войти</span><i class="nl-chevron" data-lucide="chevron-down"></i></summary><div id="loginPanel" class="login-panel nl-login-panel"><div id="telegramLogin"></div></div></details>
        <button id="logoutButton" class="nl-icon-button hidden" type="button" aria-label="Выйти"><i data-lucide="log-out"></i></button>
      </div>
    </div>
  </header>

  <main class="collections-main">
    <div class="nl-shell">
      <section class="collections-heading">
        <div><h1>Коллекции</h1><p>Подборки тайтлов НекромантЛиб</p></div>
        <button id="createCollection" class="collections-create" type="button"><i data-lucide="plus"></i><span>Создать</span></button>
      </section>

      <nav class="collections-tabs" aria-label="Разделы коллекций">
        <button class="active" type="button" data-tab="new">Новые</button>
        <button type="button" data-tab="mine">Мои коллекции</button>
      </nav>

      <section class="surface collections-panel" aria-labelledby="collectionsHeading">
        <div class="collections-panel-head">
          <h2 id="collectionsHeading">Новые</h2>
          <span id="collectionsCount">Загрузка…</span>
        </div>
        <div id="collectionsList" class="collections-list" aria-live="polite">
          <div class="collections-loading"><span></span><span></span><span></span></div>
        </div>
      </section>
    </div>
  </main>

  <dialog id="collectionDialog" class="collection-notice collection-dialog">
    <form id="collectionForm" class="collection-form">
      <button id="collectionClose" class="nl-icon-button collection-notice-close" type="button" aria-label="Закрыть"><i data-lucide="x"></i></button>
      <div class="collection-form-heading"><i data-lucide="layers-3"></i><div><h2>Новая коллекция</h2><p>Соберите собственную подборку тайтлов.</p></div></div>
      <label>Название<input id="collectionTitle" name="title" maxlength="120" required autocomplete="off" placeholder="Например, Лучшее фэнтези"></label>
      <label>Описание<textarea id="collectionDescription" name="description" maxlength="4000" rows="5" placeholder="Коротко расскажите, что объединяет тайтлы"></textarea></label>
      <label class="collection-visibility"><input id="collectionPublic" type="checkbox" checked><span><strong>Публичная коллекция</strong><small>Будет видна во вкладке «Новые».</small></span></label>
      <div id="collectionFormError" class="collection-form-error hidden" role="alert"></div>
      <div class="collection-form-actions"><button id="collectionCancel" class="collection-secondary" type="button">Отмена</button><button id="collectionSubmit" class="collections-create" type="submit">Создать</button></div>
    </form>
  </dialog>

  <footer class="nl-footer"><div class="nl-shell nl-footer-inner"><a class="nl-brand nl-footer-brand" href="/"><img src="/brand/team-logo.webp" alt="" width="34" height="34"><span>НекромантЛиб</span></a><nav aria-label="Ссылки в подвале"><a href="/catalog/">Каталог</a><a href="/collections/">Коллекции</a><a href="https://t.me/domnekromanta" target="_blank" rel="noreferrer">Дом Некроманта</a></nav><small>© 2026 НекромантЛиб</small></div></footer>
</body>
</html>
