name: Test Discovery Guard

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify automatic test discovery
        run: node scripts/test-runner.mjs --verify
