name: Probe RanobeLib team frontend

on:
  push:
    branches:
      - probe/ranobelib-team-frontend

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect current team page and frontend bundles
        shell: bash
        run: |
          node <<'NODE'
          const teamUrl = 'https://ranobelib.me/ru/team/11969--dom-nekromanta';
          const page = await fetch(teamUrl, { headers: { 'user-agent': 'Mozilla/5.0', accept: 'text/html' } });
          const html = await page.text();
          console.log('TEAM_PAGE_STATUS', page.status, 'BYTES', html.length);
          const bookMatches = [...html.matchAll(/(?:https:\/\/ranobelib\.me)?\/ru\/book\/(\d+--[A-Za-z0-9._~-]+)/g)].map(m => m[1]);
          console.log('RAW_BOOK_LINKS', [...new Set(bookMatches)].length, [...new Set(bookMatches)].slice(0, 10));
          const scriptSrcs = [...html.matchAll(/<script[^>]+src=["']([^"']+)["']/gi)].map(m => new URL(m[1], teamUrl).href);
          console.log('SCRIPT_COUNT', scriptSrcs.length);
          console.log(scriptSrcs.join('\n'));
          const apiStrings = new Set();
          for (const src of scriptSrcs) {
            try {
              const r = await fetch(src, { headers: { 'user-agent': 'Mozilla/5.0' } });
              const js = await r.text();
              for (const m of js.matchAll(/.{0,180}(?:api\/teams|\/teams\/|team_id|teamId|titles_count|team.*titles|titles.*team).{0,260}/gi)) {
                const s = m[0].replace(/\s+/g, ' ');
                if (s.includes('api') || s.includes('team')) apiStrings.add(s.slice(0, 700));
              }
            } catch (e) {
              console.log('SCRIPT_ERROR', src, String(e));
            }
          }
          console.log('=== TEAM/API BUNDLE SNIPPETS ===');
          for (const s of [...apiStrings].slice(0, 120)) console.log(s);
          NODE
