name: Probe RanobeLib team frontend

on:
  push:
    branches:
      - probe/ranobelib-team-frontend

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live RanobeLib sync state
        shell: bash
        run: |
          node <<'NODE'
          const url = 'https://domnkrbot.sashahumortele2.workers.dev/api/ranobelib?probe=' + Date.now();
          const response = await fetch(url, { headers: { accept: 'application/json' } });
          const body = await response.json();
          console.log('HTTP', response.status);
          console.log('TITLE_COUNT', Array.isArray(body.titles) ? body.titles.length : null);
          console.log('STATS', JSON.stringify(body.stats));
          console.log('SYNC', JSON.stringify(body.sync));
          console.log('FIRST_TITLES', JSON.stringify((body.titles || []).slice(0, 5).map(t => ({ book_ref: t.book_ref, title: t.title }))));
          NODE
