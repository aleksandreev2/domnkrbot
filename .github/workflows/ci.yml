name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Verify prepared Lucide vendor
        run: test -s public/vendor/lucide.min.js
      - name: Apply D1 migrations locally
        run: npm run db:local
      - name: Typecheck
        run: npm run typecheck
      - name: Check website JavaScript syntax
        run: |
          node --check public/site.js
          node --check public/propose.js
          node --check public/title.js
          node --check public/reader.js
          node --check public/ui-icons.js
          node --check public/admin/admin.js
          node --check public/admin/publication-lifecycle.js
          node --check public/admin/publishing-diagnostics.js
          node --check public/admin/proposal-raw.js
          node --check public/admin/publishing-analytics.js
          node --check public/admin/thank-gate-analytics.js
          node --check public/admin/release-analytics-detail.js
          node --check public/admin/admin-cockpit.js
          node --check public/admin/publish-editor.js
          node --check scripts/configure-bot.mjs
          node --check scripts/check-production.mjs
          test -s public/brand/team-logo.webp
          grep -Fq 'id="rawDrop"' public/propose/index.html
          grep -Fq '/api/proposal-raw/init' public/propose.js
          grep -Fq '/api/title-proposals' public/propose.js
          grep -Fq 'createMultipartUpload' src/proposal-raw-runtime.ts
          grep -Fq "status='ready'" src/proposal-raw-runtime.ts
          grep -Fq 'id="titleApp"' public/title/index.html
          grep -Fq 'id="readerSettings"' public/reader/index.html
          grep -Fq 'id="adminLink" class="admin-entry hidden"' public/index.html
          grep -Fq '/ui-icons.js?v=20260820-icons3' public/index.html
          grep -Fq '/site.js?v=20260820-reader2' public/index.html
          grep -Fq '/ui-icons.js?v=20260820-icons3' public/admin/index.html
          grep -Fq 'publishing-analytics.js?v=20260820-ops4' public/admin/index.html
          grep -Fq 'publishing-analytics.css?v=20260819-ops3' public/admin/index.html
          grep -Fq 'thank-gate-analytics.js?v=20260820-thank1' public/admin/index.html
          grep -Fq 'release-analytics-detail.js?v=20260820-release1' public/admin/index.html
          grep -Fq 'release-analytics-detail.css?v=20260820-release1' public/admin/index.html
          grep -Fq 'admin-cockpit.js?v=20260819-cockpit1' public/admin/index.html
          grep -Fq 'admin-cockpit.css?v=20260819-cockpit1' public/admin/index.html
          grep -Fq 'publish-editor.js?v=20260819-publish1' public/admin/index.html
          grep -Fq 'API_TIMEOUT_MS=10000' public/site.js
          grep -Fq 'void loadBootstrap();' public/site.js
          grep -Fq 'void loadCatalog();' public/site.js
          ! grep -Fq "Promise.all([api('/api/bootstrap'),api('/api/ranobelib')])" public/site.js
          grep -Fq 'mutationNeedsRefresh(records)' public/ui-icons.js
          grep -Fq 'requestAnimationFrame(refresh)' public/ui-icons.js
          grep -Fq "new MutationObserver((records)=>{if(mutationNeedsRefresh(records))schedule();})" public/ui-icons.js
          grep -Fq 'Опубликовать в канал' public/admin/publish-editor.js
          grep -Fq '/api/admin/publishing-center/preflight' public/admin/publish-editor.js
          grep -Fq '/api/admin/publications/${publicationId}/publish' public/admin/publish-editor.js
          grep -Fq '/api/admin/users' public/admin/admin-cockpit.js
          grep -Fq '/api/admin/activity' public/admin/admin-cockpit.js
          grep -Fq 'admin_user_controls' migrations/0008_admin_user_workspace.sql
          grep -Fq 'admin_user_messages' migrations/0008_admin_user_workspace.sql
          grep -Fq 'admin_audit_log' migrations/0008_admin_user_workspace.sql
          grep -Fq 'handleAdminUserWorkspace' src/entry.ts
          grep -Fq 'Поддержать переводчика' src/publication-ops.ts
          grep -Fq 'boosty.to/domnekromanta/single-payment/donation/818248/target?share=target_link' src/publication-ops.ts
          grep -Fq 'publication_reader_events' migrations/0006_publication_delivery_analytics.sql
          grep -Fq 'channel_access_state' migrations/0007_channel_membership_access.sql
          grep -Fq 'publication_comment_gates' migrations/0009_publication_comment_gate.sql
          grep -Fq 'publication_asset_cache_locks' migrations/0010_telegram_file_cache_lock.sql
          grep -Fq 'getChatMember' src/channel-membership-access.ts
          grep -Fq 'left_within_7d_of_download' src/channel-membership-access.ts
          grep -Fq 'ENFORCEMENT_WINDOW_MS = 7 * 24 * 60 * 60 * 1000' src/channel-membership-access.ts
          grep -Fq "allowed_updates: ['message', 'callback_query', 'chat_member']" scripts/configure-bot.mjs
          grep -Fq '"main": "src/live-entry-v2.ts"' wrangler.jsonc
          grep -Fq 'handlePublicationCommentGateWebhook' src/live-entry-v2.ts
          grep -Fq 'handlePublicationReaderDeliveryWebhook' src/live-entry-v2.ts
          grep -Fq 'handlePublicationFileCachePrewarm' src/live-entry-v2.ts
          grep -Fq 'handlePublicationReleaseAnalytics' src/live-entry-v2.ts
          grep -Fq 'handlePublishingAnalyticsV2' src/live-entry-v2.ts
          grep -Fq 'acquireTelegramFileCacheLease' src/telegram-file-cache.ts
          grep -Fq 'waitForTelegramFileId' src/telegram-file-cache.ts
          grep -Fq 'clearTelegramFileId' src/publication-reader-delivery.ts
          grep -Fq 'isInvalidCachedFileError' src/publication-reader-delivery.ts
          grep -Fq 'deleteMessage' src/publication-file-cache-prewarm.ts
          grep -Fq 'telegram_cache_prewarmed' src/publication-file-cache-prewarm.ts
          grep -Fq 'gate-download:' src/publication-comment-gate.ts
          grep -Fq 'Пост опубликован без inline-кнопок' src/publication-comment-gate.ts
          grep -Fq 'reply_markup: { inline_keyboard: [] }' src/publication-comment-gate.ts
          grep -Fq 'discussion_gate_bot_private' src/publication-ops-preflight.ts
          grep -Fq 'echarts@6.1.0' public/admin/publishing-analytics.js
          grep -Fq 'Воронка релиза' public/admin/publishing-analytics.js
          grep -Fq 'reconcile-gate' public/admin/publishing-analytics.js
          grep -Fq 'Выдача через комментарии' public/admin/publishing-analytics.js
          grep -Fq "const COMMENT_HELP_TEXT='Один download/support комментарий в discussion thread.'" public/admin/publishing-analytics.js
          grep -Fq 'commentHelp&&commentHelp.textContent!==COMMENT_HELP_TEXT' public/admin/publishing-analytics.js
          grep -Fq 'mutationNeedsInstall(records)' public/admin/publishing-analytics.js
          ! grep -Fq "if(commentHelp)commentHelp.textContent='Один download/support комментарий в discussion thread.'" public/admin/publishing-analytics.js
          grep -Fq '.statistics-release-table' public/admin/publishing-analytics.css
          grep -Fq '/api/admin/membership-access' public/admin/publishing-analytics.js
          grep -Fq 'Нажали «Спасибо» в комментарии' public/admin/thank-gate-analytics.js
          grep -Fq 'duplicateThanks.hidden=true' public/admin/thank-gate-analytics.js
          grep -Fq '/api/admin/publishing-analytics/release?publication_id=' public/admin/release-analytics-detail.js
          grep -Fq 'data-release-user' public/admin/release-analytics-detail.js
          grep -Fq '/api/admin/publishing-analytics/release' src/publication-release-analytics.ts
          grep -Fq 'gate-thanks:' src/publication-reader-delivery.ts
          grep -Fq 'thank_you_required' src/publication-reader-delivery.ts
          grep -Fq 'delivery_started' src/publication-reader-delivery.ts
          grep -Fq 'telegram_file_id' src/publication-reader-delivery.ts
          grep -Fq 'env.DB.batch' src/publication-reader-delivery.ts
          grep -Fq "querySelectorAll('i[data-lucide]')" public/ui-icons.js
          grep -Fq "nameAttr:'data-domnkr-lucide'" public/ui-icons.js
          grep -Fq "removeAttribute('data-domnkr-lucide')" public/ui-icons.js
      - name: Tests
        run: npm test
      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run

  production-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify workers.dev serves current build
        run: node scripts/check-production.mjs