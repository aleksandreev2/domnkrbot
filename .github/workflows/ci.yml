name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Verify prepared Lucide vendor
        run: test -s public/vendor/lucide.min.js
      - name: Apply D1 migrations locally
        run: npm run db:local
      - name: Typecheck
        run: npm run typecheck
      - name: Check website JavaScript syntax
        run: |
          node --check public/site.js
          node --check public/propose.js
          node --check public/ui-icons.js
          node --check public/admin/admin.js
          node --check public/admin/publication-lifecycle.js
          node --check public/admin/publishing-diagnostics.js
          node --check scripts/configure-bot.mjs
          node --check scripts/check-production.mjs
          test -s public/brand/team-logo.webp
          grep -Fq 'id="proposalRaw"' public/propose/index.html
          grep -Fq 'Для нового тайтла обязательна ссылка на RAW.' src/title-proposal-policy.ts
          grep -Fq 'id="adminLink" class="utility-admin hidden"' public/index.html
          grep -Fq "querySelectorAll('i[data-lucide]')" public/ui-icons.js
          grep -Fq "nameAttr:'data-domnkr-lucide'" public/ui-icons.js
          grep -Fq "removeAttribute('data-domnkr-lucide')" public/ui-icons.js
      - name: Tests
        run: npm test
      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run

  production-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify workers.dev serves current build
        run: node scripts/check-production.mjs
