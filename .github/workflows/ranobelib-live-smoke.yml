name: RanobeLib live smoke

on:
  pull_request:

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect team route calls
        run: |
          node --input-type=module <<'NODE'
          const url = 'https://ranobelib.me/build/assets/team-_IkRvLmj.js';
          const js = await (await fetch(url)).text();
          console.log('team chunk bytes', js.length);
          const calls = [...new Set([...js.matchAll(/(?:get|post|update|delete)\((['"])(\/[^'"]+)\1/g)].map((m) => m[2]))];
          console.log('API call strings:');
          console.log(calls.join('\n'));
          for (const needle of ['api-endpoint', 'TeamTitles', 'team-show', 'teams/{', 'requestHandler']) {
            console.log(`\nCONTEXT ${needle}`);
            let pos = 0, count = 0;
            while (count < 20) {
              const i = js.indexOf(needle, pos);
              if (i < 0) break;
              console.log(js.slice(Math.max(0, i - 600), Math.min(js.length, i + needle.length + 1200)).replace(/\s+/g, ' '));
              pos = i + needle.length;
              count += 1;
            }
          }
          NODE
      - name: Probe current RanobeLib API
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://api.cdnlibs.org/api';
          const headers = {
            accept: 'application/json',
            'Site-Id': '3',
            'Client-Time-Zone': 'UTC',
            'Content-Type': 'application/json',
            origin: 'https://ranobelib.me',
            referer: 'https://ranobelib.me/'
          };
          const urls = [
            `${base}/teams/11969--dom-nekromanta`,
            `${base}/teams/11969`,
            `${base}/teams/11969/chapters`,
            `${base}/teams/11969/manga`,
            `${base}/teams/11969/titles`,
            `${base}/manga/62387--pokemon-master-of-tactics`,
            `${base}/manga/62387--pokemon-master-of-tactics/chapters`
          ];
          for (const url of urls) {
            try {
              const response = await fetch(url, { headers });
              const text = await response.text();
              console.log('\nURL', url, 'STATUS', response.status, 'TYPE', response.headers.get('content-type'), 'BYTES', text.length);
              console.log(text.slice(0, 5000).replace(/\s+/g, ' '));
            } catch (error) {
              console.log('\nURL', url, 'ERROR', error?.message ?? String(error));
            }
          }
          NODE
