name: RanobeLib live smoke

on:
  pull_request:

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect API client configuration
        run: |
          node --input-type=module <<'NODE'
          const url = 'https://ranobelib.me/build/assets/common-BLGqP_xm.js';
          const js = await (await fetch(url)).text();
          const needles = [
            'baseURL','baseUrl','apiUrl','api_url','API_URL','location.hostname','location.host',
            'location.origin','hostname','api.','cdnlibs.org','new URL(','.params2=', 'params2(',
            'parseUrl(', 'axios.create', 'new URLSearchParams'
          ];
          for (const needle of needles) {
            console.log('\nNEEDLE', needle);
            let pos = 0, shown = 0;
            while (shown < 20) {
              const i = js.indexOf(needle, pos);
              if (i < 0) break;
              console.log('INDEX', i, js.slice(Math.max(0, i - 700), Math.min(js.length, i + needle.length + 1400)).replace(/\s+/g, ' '));
              pos = i + needle.length;
              shown += 1;
            }
            console.log('shown', shown);
          }
          NODE
