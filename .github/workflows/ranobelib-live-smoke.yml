name: RanobeLib live smoke

on:
  pull_request:

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect catalog filter implementation
        run: |
          node --input-type=module <<'NODE'
          const url = 'https://ranobelib.me/build/assets/common-BLGqP_xm.js';
          const js = await (await fetch(url)).text();
          for (const needle of ['target_model','target_id','default-filters','defaultFilters','/manga?', 'get("/manga"', 'get("/media"', 'get("/titles"']) {
            console.log(`\nCONTEXT ${needle}`);
            let pos = 0, count = 0;
            while (count < 30) {
              const i = js.indexOf(needle, pos);
              if (i < 0) break;
              console.log('INDEX', i, js.slice(Math.max(0, i - 900), Math.min(js.length, i + needle.length + 1800)).replace(/\s+/g, ' '));
              pos = i + needle.length;
              count += 1;
            }
          }
          NODE
      - name: Probe team title catalog filters
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://api.cdnlibs.org/api';
          const headers = {
            accept: 'application/json',
            'Site-Id': '3',
            'Client-Time-Zone': 'UTC',
            'Content-Type': 'application/json',
            origin: 'https://ranobelib.me',
            referer: 'https://ranobelib.me/'
          };
          const qs = new URLSearchParams({ target_id: '11969', target_model: 'team' }).toString();
          const candidates = [
            `${base}/manga?${qs}`,
            `${base}/media?${qs}`,
            `${base}/titles?${qs}`,
            `${base}/catalog?${qs}`,
            `${base}/manga?target_id=11969&target_model=team&site_id=3`,
            `${base}/manga?target_id=11969&target_model=team&limit=100`,
            `${base}/teams/11969/chapters?limit=100`
          ];
          for (const url of candidates) {
            const response = await fetch(url, { headers });
            const text = await response.text();
            console.log('\nURL', url, 'STATUS', response.status, 'BYTES', text.length, 'TYPE', response.headers.get('content-type'));
            console.log(text.slice(0, 4000).replace(/\s+/g, ' '));
          }
          NODE
