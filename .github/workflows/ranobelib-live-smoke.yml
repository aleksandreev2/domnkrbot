name: RanobeLib live smoke

on:
  pull_request:

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: List frontend chunk references
        run: |
          node --input-type=module <<'NODE'
          const url = 'https://ranobelib.me/build/assets/main-Qg5Y60Oc.js';
          const response = await fetch(url);
          const js = await response.text();
          console.log('status', response.status, 'bytes', js.length);
          const refs = [...new Set([...js.matchAll(/[A-Za-z0-9_.$@~()+-]+-[A-Za-z0-9_-]+\.js/g)].map((m) => m[0]))];
          console.log('js refs', refs.length);
          console.log(refs.join('\n'));
          for (const needle of ['__vite__mapDeps','build/assets','import(']) {
            const i = js.indexOf(needle);
            console.log('\nneedle', needle, 'at', i);
            if (i >= 0) console.log(js.slice(Math.max(0, i - 1000), i + 6000));
          }
          NODE
