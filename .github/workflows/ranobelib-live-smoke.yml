name: RanobeLib live smoke

on:
  pull_request:

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe current same-origin RanobeLib API
        run: |
          node --input-type=module <<'NODE'
          const urls = [
            'https://ranobelib.me/api/teams/11969--dom-nekromanta',
            'https://ranobelib.me/api/teams/11969',
            'https://ranobelib.me/api/manga/62387--pokemon-master-of-tactics',
            'https://ranobelib.me/api/manga/62387--pokemon-master-of-tactics/chapters'
          ];
          for (const url of urls) {
            const response = await fetch(url, { headers: { accept: 'application/json', 'accept-language': 'ru,en;q=0.7', referer: 'https://ranobelib.me/' } });
            const text = await response.text();
            console.log('\nURL', url, 'STATUS', response.status, 'TYPE', response.headers.get('content-type'), 'BYTES', text.length);
            console.log(text.slice(0, 1600).replace(/\s+/g, ' '));
          }
          NODE
      - name: Inspect team page frontend chunk
        run: |
          node --input-type=module <<'NODE'
          const url = 'https://ranobelib.me/build/assets/team-_IkRvLmj.js';
          const response = await fetch(url);
          const js = await response.text();
          console.log('status', response.status, 'type', response.headers.get('content-type'), 'bytes', js.length);
          for (const needle of ['/teams/', '/manga', 'fetchTeam', 'media', 'chapters', 'slug_url']) {
            console.log('\nNEEDLE', needle);
            let pos = 0, shown = 0;
            while (shown < 20) {
              const i = js.indexOf(needle, pos);
              if (i < 0) break;
              console.log(js.slice(Math.max(0, i - 400), Math.min(js.length, i + needle.length + 900)).replace(/\s+/g, ' '));
              pos = i + needle.length;
              shown += 1;
            }
            console.log('shown', shown);
          }
          NODE
